<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[미니멀 비교작] 키아노스 × 에리트로스 | KYANOS MINIMALIST</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Noto+Sans+KR:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #38bdf8;
            --accent-red: #ff2a55;
            --text-main: rgba(248, 250, 252, 0.92);
            --text-sub: rgba(148, 163, 184, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01040a;
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-main);
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 극단적 미니멀 UI — 텍스트와 여백만 남김 */
        .minimal-header {
            position: absolute;
            top: 36px;
            left: 44px;
            z-index: 10;
            pointer-events: auto;
        }

        .minimal-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 6px;
            color: #ffffff;
        }

        .minimal-header p {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 300;
        }

        /* 우측 상단 극소형 모드 스위처 */
        .minimal-switch {
            position: absolute;
            top: 36px;
            right: 44px;
            z-index: 10;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .switch-link {
            background: none;
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding-bottom: 4px;
            border-bottom: 1px solid transparent;
            transition: all 0.5s ease;
        }

        .switch-link.active-k {
            color: #7dd3fc;
            border-bottom-color: #38bdf8;
        }

        .switch-link.active-e {
            color: #ff4d6d;
            border-bottom-color: #ff2a55;
        }

        /* 하단 중앙 극단적 여백의 명언 */
        .minimal-footer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 85%;
            max-width: 600px;
        }

        .minimal-footer p {
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1.5px;
            color: rgba(241, 245, 249, 0.75);
            line-height: 1.8;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .minimal-footer span {
            color: #ff4d6d;
            font-weight: 500;
        }

        body.erythros-theme .minimal-footer span {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <!-- Minimal Header -->
    <div class="minimal-header">
        <h1>KYANOS</h1>
        <p>OCEAN · COSMOS · PURE INTELLIGENCE</p>
    </div>

    <!-- Minimal Mode Switcher -->
    <div class="minimal-switch">
        <button class="switch-link active-k" id="btn-k" onclick="setTheme('kyanos')">KYANOS</button>
        <button class="switch-link" id="btn-e" onclick="setTheme('erythros')">ERYTHROS</button>
    </div>

    <!-- Minimal Footer Quote -->
    <div class="minimal-footer">
        <p id="footer-quote">
            깊고 고요한 푸른 대양과 밤하늘 위, 단 하나의 <span>에리트로스(Erythros)</span>가 세상을 비춘다.
        </p>
    </div>

    <script>
        // --- 1. Scene & Seamless Horizon Setup ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();

        const bgKyanos = new THREE.Color(0x01050d);
        const bgErythros = new THREE.Color(0x0d0205);
        scene.background = bgKyanos.clone();
        scene.fog = new THREE.FogExp2(bgKyanos.getHex(), 0.0085);

        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 88);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.target.set(0, 4, 0);
        controls.enableZoom = true;
        controls.minDistance = 40;
        controls.maxDistance = 140;
        controls.maxPolarAngle = Math.PI / 2 - 0.04;
        controls.minPolarAngle = Math.PI / 4;

        // --- 2. 부드러운 원형 별빛 텍스처 ---
        function createSoftStarTexture() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.7)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }
        const starTex = createSoftStarTexture();

        // --- 3. 조명 시스템 (여백과 빛의 반사) ---
        const ambientLight = new THREE.AmbientLight(0x0a192f, 1.2);
        scene.add(ambientLight);

        // 중앙 구체에서 뿜어져 나와 바다 수면을 물들이는 주 광원
        const orbLight = new THREE.PointLight(0xff2a55, 6.0, 220);
        orbLight.position.set(0, 8, 0);
        scene.add(orbLight);

        // 하늘의 은은한 푸른 달빛/별빛
        const moonLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        moonLight.position.set(0, 50, -60);
        scene.add(moonLight);

        // --- 4. 극도로 정제된 고요한 대양 (Serene Smooth Ocean) ---
        const oceanGeo = new THREE.PlaneGeometry(450, 450, 100, 100);
        oceanGeo.rotateX(-Math.PI / 2);

        const oceanMat = new THREE.MeshStandardMaterial({
            color: 0x021730,
            roughness: 0.08,   // 유리알 같은 매끄러운 수면 반사
            metalness: 0.92,
            flatShading: false
        });
        const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
        oceanMesh.position.y = -10;
        scene.add(oceanMesh);

        // --- 5. 여백을 살린 밤하늘 별빛 (단 450개의 고요한 성좌) ---
        const starCount = 450;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
            const r = 120 + Math.random() * 220;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.45; // 지평선 위 하늘

            starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = r * Math.cos(phi) - 5;
            starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

        const starMat = new THREE.PointsMaterial({
            color: 0xe0f2fe,
            size: 1.8,
            map: starTex,
            transparent: true,
            opacity: 0.75,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const starsMesh = new THREE.Points(starGeo, starMat);
        scene.add(starsMesh);

        // --- 6. 단 하나의 순수한 빛의 구체 (The Singular Orb — 회전하는 고리/파티클 배제) ---
        const orbGroup = new THREE.Group();
        orbGroup.position.set(0, 7.5, 0);

        // 중심 발광 구체
        const coreGeo = new THREE.SphereGeometry(5.5, 64, 64);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0xff2a55,
            emissive: 0xe11d48,
            emissiveIntensity: 1.8,
            roughness: 0.1,
            metalness: 0.2
        });
        const coreOrb = new THREE.Mesh(coreGeo, coreMat);
        orbGroup.add(coreOrb);

        // 부드러운 외곽 빛의 후광 (Soft Halo Glow)
        const haloGeo = new THREE.SphereGeometry(8.2, 64, 64);
        const haloMat = new THREE.MeshBasicMaterial({
            color: 0xff2a55,
            transparent: true,
            opacity: 0.16,
            blending: THREE.AdditiveBlending
        });
        const haloOrb = new THREE.Mesh(haloGeo, haloMat);
        orbGroup.add(haloOrb);

        // 수평으로 조용히 감도는 단 하나의 얇은 빛의 선 (Single Minimalist Ring)
        const ringGeo = new THREE.TorusGeometry(11.5, 0.05, 16, 180);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending
        });
        const singleRing = new THREE.Mesh(ringGeo, ringMat);
        singleRing.rotation.x = Math.PI / 2.2;
        orbGroup.add(singleRing);

        scene.add(orbGroup);

        // --- 7. 테마 전환 로직 (Kyanos <-> Erythros) ---
        let currentTheme = 'kyanos';
        const clock = new THREE.Clock();

        function setTheme(theme) {
            currentTheme = theme;
            const btnK = document.getElementById('btn-k');
            const btnE = document.getElementById('btn-e');
            const quote = document.getElementById('footer-quote');

            if (theme === 'erythros') {
                document.body.classList.add('erythros-theme');
                btnK.classList.remove('active-k');
                btnE.classList.add('active-e');

                // 배경과 바다: 붉은 빛이 감도는 심연 / 코어: 순수한 푸른 키아노스 빛(보색)
                scene.background.copy(bgErythros);
                scene.fog.color.copy(bgErythros);
                oceanMat.color.setHex(0x20030b);
                moonLight.color.setHex(0xff4d6d);
                starMat.color.setHex(0xffe4e6);

                // 중심 구체는 에리트로스 속에서 역설적으로 빛나는 푸른 키아노스 OR 찬란한 백열 붉은 태양
                coreMat.color.setHex(0x00f2fe);
                coreMat.emissive.setHex(0x0284c7);
                haloMat.color.setHex(0x38bdf8);
                orbLight.color.setHex(0x00f2fe);
                ringMat.color.setHex(0xff2a55);

                quote.innerHTML = '에리트로스(Erythros)의 붉은 여명 위에서, 순수한 지성 <span>키아노스(Kyanos)</span>가 고요히 숨 쉰다.';
            } else {
                document.body.classList.remove('erythros-theme');
                btnE.classList.remove('active-e');
                btnK.classList.add('active-k');

                // 배경과 바다: 깊고 푸른 키아노스 / 코어: 선명한 에리트로스 붉은 태양
                scene.background.copy(bgKyanos);
                scene.fog.color.copy(bgKyanos);
                oceanMat.color.setHex(0x021730);
                moonLight.color.setHex(0x38bdf8);
                starMat.color.setHex(0xe0f2fe);

                coreMat.color.setHex(0xff2a55);
                coreMat.emissive.setHex(0xe11d48);
                haloMat.color.setHex(0xff2a55);
                orbLight.color.setHex(0xff2a55);
                ringMat.color.setHex(0x38bdf8);

                quote.innerHTML = '깊고 고요한 푸른 대양과 밤하늘 위, 단 하나의 <span>에리트로스(Erythros)</span>가 세상을 비춘다.';
            }
        }

        // --- 8. 고요하고 느린 호흡의 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // 아주 느리고 평온한 밤하늘 회전
            starsMesh.rotation.y = elapsed * 0.008;

            // 잔잔하게 일렁이는 거울 같은 심해 파동
            const pos = oceanGeo.attributes.position;
            const count = pos.count;
            const t = elapsed * 0.65; // 속도를 대폭 늦춰 고요함 극대화

            for (let i = 0; i < count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);

                const y = Math.sin(x * 0.025 + t) * 1.1 +
                          Math.cos(z * 0.022 + t * 0.8) * 1.0;

                pos.setY(i, y);
            }
            pos.needsUpdate = true;
            oceanGeo.computeVertexNormals();

            // 단 하나의 구체가 숨 쉬듯 천천히 부유 (Slow Breathing)
            orbGroup.position.y = 7.5 + Math.sin(elapsed * 0.9) * 0.9;
            const breath = 1 + Math.sin(elapsed * 1.4) * 0.03;
            haloOrb.scale.setScalar(breath);

            // 단 하나의 얇은 선이 아주 천천히 기울기를 바꿈
            singleRing.rotation.z = elapsed * 0.12;
            singleRing.rotation.y = Math.sin(elapsed * 0.3) * 0.2;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
