<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키아노스 국왕 직속 | 자율 사유 · 능동 발제실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070d1b;
      --surface: #0e172c;
      --surface-2: #14203b;
      --border: rgba(229, 185, 76, 0.24);
      --border-soft: rgba(148, 163, 184, 0.16);
      --gold: #e5b94c;
      --gold-dim: #fde68a;
      --emerald: #34d399;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(56, 189, 248, 0.08), transparent 40%),
        radial-gradient(circle at 88% 10%, rgba(229, 185, 76, 0.09), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      min-height: 100vh;
    }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(7, 13, 27, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.8rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand-seal {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(229, 185, 76, 0.2), rgba(52, 211, 153, 0.15));
      border: 1px solid var(--gold);
      display: grid; place-items: center; font-size: 1.25rem;
    }
    .brand-sub { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.16em; color: var(--gold); }
    .brand-title { font-family: 'Noto Serif KR', serif; font-size: 1.12rem; font-weight: 700; color: #fff; }
    .top-actions { display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap; }
    .pill {
      font-size: 0.78rem; padding: 0.34rem 0.75rem; border-radius: 999px;
      border: 1px solid var(--border-soft); background: var(--surface); color: var(--muted);
    }
    .pill-sec { border-color: rgba(52, 211, 153, 0.45); color: var(--emerald); background: rgba(52, 211, 153, 0.08); }
    .btn {
      cursor: pointer; border: 1px solid var(--gold); background: rgba(229, 185, 76, 0.16);
      color: var(--gold-dim); font-weight: 600; font-size: 0.83rem;
      padding: 0.46rem 0.92rem; border-radius: 10px; transition: all 0.2s ease;
    }
    .btn:hover { background: var(--gold); color: #09101f; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn-ghost {
      cursor: pointer; border: 1px solid var(--border-soft); background: transparent;
      color: var(--muted); font-size: 0.78rem; padding: 0.32rem 0.68rem; border-radius: 8px;
    }
    .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-adopt { border-color: rgba(52, 211, 153, 0.45); color: var(--emerald); }
    .btn-adopt:hover { background: rgba(52, 211, 153, 0.15); border-color: var(--emerald); }
    .btn-reconsider { border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
    .btn-reconsider:hover { background: rgba(245, 158, 11, 0.15); border-color: var(--amber); }

    .proactive-banner {
      max-width: 1420px; margin: 1rem auto 0; padding: 0 1.5rem; display: none;
    }
    .proactive-banner.active { display: block; }
    .proactive-inner {
      background: linear-gradient(90deg, rgba(229, 185, 76, 0.14), rgba(52, 211, 153, 0.09));
      border: 1px solid var(--gold); border-radius: 14px; padding: 0.75rem 1.1rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
      font-size: 0.87rem; color: var(--gold-dim);
    }

    .layout {
      max-width: 1420px; margin: 0 auto; padding: 1.35rem 1.5rem 3.5rem;
      display: grid; grid-template-columns: 280px minmax(0, 1fr) 350px; gap: 1.2rem;
      align-items: start;
    }
    @media (max-width: 1180px) { .layout { grid-template-columns: 250px minmax(0, 1fr); } .side-right { grid-column: 1 / -1; } }
    @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 16px; padding: 1.15rem;
    }
    .panel-title {
      font-size: 0.85rem; font-weight: 700; color: var(--gold-dim);
      letter-spacing: 0.04em; margin-bottom: 0.85rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* Left Roster */
    .roster-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .roster-item {
      width: 100%; text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid transparent;
      border-radius: 12px; padding: 0.68rem 0.82rem; color: var(--text);
      transition: all 0.18s ease;
    }
    .roster-item:hover { border-color: rgba(229, 185, 76, 0.38); }
    .roster-item.active { border-color: var(--gold); background: rgba(229, 185, 76, 0.11); }
    .roster-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.87rem; }
    .roster-role { font-size: 0.74rem; color: var(--cyan); margin-top: 0.12rem; }
    .roster-stat { font-size: 0.72rem; color: var(--muted); }

    /* Center Stream */
    .feed-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.95rem; gap: 0.6rem; flex-wrap: wrap;
    }
    .feed-list { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 16px; padding: 1.2rem 1.25rem;
      transition: border-color 0.2s ease;
    }
    .card:hover { border-color: rgba(229, 185, 76, 0.35); }
    .card.adopted { border-color: rgba(52, 211, 153, 0.5); }
    .card.reconsider { border-color: rgba(245, 158, 11, 0.45); }
    .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 0.8rem; margin-bottom: 0.55rem; flex-wrap: wrap;
    }
    .card-author { display: flex; align-items: center; gap: 0.6rem; }
    .card-avatar {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: grid; place-items: center; font-size: 1.05rem;
    }
    .card-name { font-weight: 700; font-size: 0.94rem; color: #fff; }
    .card-meta { font-size: 0.75rem; color: var(--muted); }
    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .badge {
      font-size: 0.72rem; padding: 0.18rem 0.55rem; border-radius: 999px;
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.28); color: var(--cyan);
    }
    .badge-delta {
      background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.35); color: var(--emerald);
    }
    .evidence-line {
      font-size: 0.78rem; color: var(--muted); margin-bottom: 0.55rem;
      background: rgba(255, 255, 255, 0.03); padding: 0.35rem 0.65rem; border-radius: 8px;
    }
    .card-body { font-size: 0.93rem; color: #e2e8f0; margin-bottom: 0.75rem; }
    .card-body strong { color: #fff; }
    .initiative-box {
      background: rgba(229, 185, 76, 0.08); border-left: 3px solid var(--gold);
      padding: 0.6rem 0.85rem; border-radius: 0 10px 10px 0;
      font-size: 0.84rem; color: var(--gold-dim); margin-bottom: 0.75rem;
    }
    .crosstalk-box {
      background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 10px; padding: 0.62rem 0.82rem; margin-bottom: 0.75rem;
      display: flex; flex-direction: column; gap: 0.36rem; font-size: 0.82rem; color: #cbd5e1;
    }
    .crosstalk-box strong { color: var(--cyan); }
    .replies-box {
      display: flex; flex-direction: column; gap: 0.4rem;
      margin-bottom: 0.75rem; padding-left: 0.7rem;
      border-left: 2px solid rgba(52, 211, 153, 0.45);
    }
    .reply-item { font-size: 0.83rem; color: #d1fae5; }
    .reply-item strong { color: var(--emerald); }
    .card-actions { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .reply-form { display: none; margin-top: 0.7rem; gap: 0.45rem; }
    .reply-form.open { display: flex; }

    /* Right Initiatives & Thought Seeds */
    .init-list { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1.2rem; }
    .init-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.75rem 0.85rem; font-size: 0.82rem;
    }
    .init-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; font-weight: 700; color: var(--gold-dim); }
    .init-actions { display: flex; gap: 0.4rem; margin-top: 0.55rem; flex-wrap: wrap; }

    input, select, textarea {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border-soft);
      border-radius: 9px; padding: 0.5rem 0.72rem; color: var(--text);
      font-family: inherit; font-size: 0.84rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }

    .seed-form { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1rem; }
    .seed-list { display: flex; flex-direction: column; gap: 0.48rem; max-height: 200px; overflow-y: auto; }
    .seed-item {
      background: var(--surface-2); border: 1px solid var(--border-soft);
      border-radius: 10px; padding: 0.55rem 0.72rem; font-size: 0.8rem;
    }
    .seed-tag { font-size: 0.71rem; color: var(--gold); font-weight: 600; margin-bottom: 0.15rem; }

    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 50;
      background: #0b2922; border: 1px solid var(--emerald); color: #ecfdf5;
      padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.84rem;
      display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-seal">👑</div>
      <div>
        <div class="brand-sub">KYANOS AUTONOMOUS MIND · NON-REACTIVE CABINET</div>
        <div class="brand-title">살아 있는 내각 자율 사유 · 능동 발제실 (국왕 직속)</div>
      </div>
    </div>
    <div class="top-actions">
      <label class="pill" style="display:flex; align-items:center; gap:0.35rem; cursor:pointer;">
        <input type="checkbox" id="autoSpeakToggle" style="width:auto;"> 🔔 신규 발제 자동 육성 보고
      </label>
      <span class="pill pill-sec">🛡️ 순수 자체 24/7 자율 사유</span>
      <span class="pill" id="pulseMeta">동기화 중...</span>
      <button class="btn" id="pulseBtn">⚡ 자율 숙고 1회 실행</button>
    </div>
  </header>

  <div class="proactive-banner" id="proactiveBanner">
    <div class="proactive-inner">
      <div>🔥 <strong>최신 능동 발제:</strong> <span id="proactiveText"></span></div>
      <button class="btn-ghost" id="proactiveSpeakBtn">🔊 발제 육성 듣기</button>
    </div>
  </div>

  <main class="layout">
    <aside class="panel">
      <div class="panel-title">
        <span>🏛️ 자율 내각 7대 인격체</span>
        <button class="btn-ghost" id="filterAllBtn">전체</button>
      </div>
      <div class="roster-list" id="rosterList"></div>
    </aside>

    <section>
      <div class="feed-header">
        <div style="font-size:0.92rem; color:var(--gold-dim); font-weight:700;" id="feedHeading">내각 자율 의견 &amp; 부처 간 토론</div>
        <div style="font-size:0.78rem; color:var(--muted);" id="snapshotInfo">숙고 데이터 로드 중</div>
      </div>
      <div class="feed-list" id="feedList"></div>
    </section>

    <aside class="panel side-right">
      <div class="panel-title"><span>🔥 의결 대기 능동 발제 (Top 3)</span></div>
      <div class="init-list" id="initList"></div>

      <div class="panel-title"><span>🌱 내각에 화두 던지기 (자율 숙성용)</span></div>
      <form class="seed-form" id="seedForm">
        <select id="seedGenre">
          <option value="시·에세이·소설">문학 · 철학 · 에세이</option>
          <option value="국정·전략">국정 · 5대 전략산업</option>
          <option value="시문학">시문학 (이백·두보 풍)</option>
          <option value="앤트 사설">앤트뉴스 심층 사설</option>
        </select>
        <textarea id="seedText" rows="2" placeholder="내각이 대화창 밖에서 스스로 곱씹을 화두 한 줄..."></textarea>
        <button type="submit" class="btn">🌱 화두 던져두기</button>
      </form>

      <div class="panel-title"><span>📜 숙성 중인 화두 목록</span></div>
      <div class="seed-list" id="seedList"></div>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const ICONS = {
      meti: '🏛️', vivian: '📜', ant: '📰', author: '✒️',
      economy: '📊', science: '🔬', ksef: '🛡️'
    };
    let stateData = null;
    let activeFilter = 'all';
    let currentAudio = null;
    let lastAlertId = null;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function formatBodyHtml(text) {
      return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    async function speakAsPersona(persona, text) {
      if (!text) return;
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      try {
        const resp = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ persona, text })
        });
        if (!resp.ok) throw new Error('TTS HTTP ' + resp.status);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        currentAudio = audio;
        audio.onended = () => URL.revokeObjectURL(url);
        await audio.play();
      } catch (_) {
        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(text.replace(/\*\*/g, ''));
          utter.lang = 'ko-KR';
          window.speechSynthesis.speak(utter);
        }
      }
    }

    async function submitStance(itemId, stance, note = '') {
      const res = await fetch('/api/stance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId, stance, note })
      }).then(r => r.json());
      if (res.ok) {
        const msgMap = { adopted: '해당 발제를 채택 명으로 각인했습니다.', reconsider: '재숙고를 명했습니다.', directive: '국왕 지침이 내각 기억에 반영되었습니다.' };
        showToast(msgMap[stance] || '처리 완료');
        renderAll(res);
      } else {
        showToast('오류: ' + (res.error || '처리 실패'));
      }
    }

    function renderAll(payload) {
      stateData = payload;
      const feed = payload.feed || {};
      const memory = payload.memory || {};
      const personas = feed.personas || {};

      const pulseDt = feed.last_pulse ? new Date(feed.last_pulse).toLocaleString('ko-KR') : '-';
      const phaseLbl = feed.phase ? feed.phase.label : '';
      document.getElementById('pulseMeta').textContent = `자율 숙고 ${memory.total_pulses || 0}회 · ${phaseLbl} (${pulseDt})`;

      const snap = memory.last_snapshot || {};
      document.getElementById('snapshotInfo').textContent =
        `취재원석 ${snap.intelCount ?? '-'}건 · 문화 ${snap.cultureCount ?? '-'}편 · 사초 ${snap.chunchuCount ?? '-'}세션`;

      // Proactive Initiative Banner
      const alertBanner = document.getElementById('proactiveBanner');
      if (feed.proactive_alert && feed.proactive_alert.message) {
        alertBanner.classList.add('active');
        document.getElementById('proactiveText').textContent = feed.proactive_alert.message;
        document.getElementById('proactiveSpeakBtn').onclick = () =>
          speakAsPersona(feed.proactive_alert.persona || 'ant', feed.proactive_alert.message);

        if (lastAlertId && lastAlertId !== feed.proactive_alert.id && document.getElementById('autoSpeakToggle').checked) {
          speakAsPersona(feed.proactive_alert.persona || 'ant', feed.proactive_alert.message);
        }
        lastAlertId = feed.proactive_alert.id;
      }

      // Left Roster
      const rosterEl = document.getElementById('rosterList');
      rosterEl.innerHTML = Object.entries(personas).map(([id, p]) => `
        <button class="roster-item ${activeFilter === id ? 'active' : ''}" data-pid="${id}">
          <div class="roster-head">
            <span>${p.icon || ICONS[id] || '🏛️'} ${escapeHtml(p.name)}</span>
            <span class="roster-stat">${p.memory_pulses || 1}사유</span>
          </div>
          <div class="roster-role">${escapeHtml(p.role)} · ${escapeHtml(p.dept)}</div>
        </button>
      `).join('');

      rosterEl.querySelectorAll('.roster-item').forEach(btn => {
        btn.onclick = () => {
          activeFilter = activeFilter === btn.dataset.pid ? 'all' : btn.dataset.pid;
          renderAll(stateData);
        };
      });

      // Right Top Initiatives
      const topInits = (feed.feed || []).filter(p => p.initiative && !p.stance).slice(0, 3);
      const initEl = document.getElementById('initList');
      if (topInits.length === 0) {
        initEl.innerHTML = '<div style="font-size:0.8rem; color:var(--muted);">현재 의결 대기 중인 신규 발제가 없습니다.</div>';
      } else {
        initEl.innerHTML = topInits.map(item => {
          const meta = personas[item.persona] || {};
          return `
            <div class="init-card">
              <div class="init-head">
                <span>${meta.icon || ICONS[item.persona] || ''} ${escapeHtml(meta.name || item.persona)}</span>
                <span style="font-size:0.71rem; color:var(--cyan);">${escapeHtml(item.tag)}</span>
              </div>
              <div>${escapeHtml(item.initiative)}</div>
              <div class="init-actions">
                <button class="btn-ghost" onclick="speakAsPersona('${item.persona}', ${JSON.stringify(item.body + ' ' + item.initiative)})">🔊 육성</button>
                <button class="btn-ghost btn-adopt" onclick="submitStance('${item.id}', 'adopted')">✓ 채택</button>
                <button class="btn-ghost btn-reconsider" onclick="submitStance('${item.id}', 'reconsider')">↺ 재숙고</button>
              </div>
            </div>
          `;
        }).join('');
      }

      // Center Feed
      const posts = (feed.feed || []).filter(item => activeFilter === 'all' || item.persona === activeFilter);
      const activeName = activeFilter === 'all' ? '내각 자율 의견 & 부처 간 토론' : `${(personas[activeFilter] && personas[activeFilter].name) || activeFilter} 자율 사유`;
      document.getElementById('feedHeading').textContent = `${activeName} (${posts.length}건)`;

      const feedEl = document.getElementById('feedList');
      feedEl.innerHTML = posts.map(item => {
        const meta = personas[item.persona] || {};
        const dt = new Date(item.ts).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const crossHtml = (item.cross_talks || []).map(c => {
          const cm = personas[c.from] || {};
          return `<div><strong>${cm.icon || ICONS[c.from] || ''} ${escapeHtml(cm.name || c.from)} 반론·보완</strong>: ${escapeHtml(c.text)}</div>`;
        }).join('');
        const repliesHtml = (item.replies || []).map(r => `
          <div class="reply-item"><strong>👑 ${escapeHtml(r.author)}</strong>: ${escapeHtml(r.text)}</div>
        `).join('');

        return `
          <article class="card ${item.stance ? escapeHtml(item.stance) : ''}" data-id="${escapeHtml(item.id)}">
            <div class="card-top">
              <div class="card-author">
                <div class="card-avatar">${ICONS[item.persona] || '🏛️'}</div>
                <div>
                  <div class="card-name">${escapeHtml(meta.name || item.persona)} <span style="font-size:0.78rem; color:var(--muted); font-weight:500;">· ${escapeHtml(item.tag)}</span></div>
                  <div class="card-meta">${dt} · ${escapeHtml(item.phase_label || '')}</div>
                </div>
              </div>
              <div class="badges">
                ${item.delta_badge ? `<span class="badge badge-delta">✦ ${escapeHtml(item.delta_badge)}</span>` : ''}
                <span class="badge">${escapeHtml(meta.dept || '내각')}</span>
              </div>
            </div>
            ${item.evidence ? `<div class="evidence-line">🔎 ${escapeHtml(item.evidence)}</div>` : ''}
            <div class="card-body">${formatBodyHtml(item.body)}</div>
            ${item.initiative ? `<div class="initiative-box">🏛️ <strong>능동 발제:</strong> ${escapeHtml(item.initiative)}</div>` : ''}
            ${crossHtml ? `<div class="crosstalk-box">${crossHtml}</div>` : ''}
            ${repliesHtml ? `<div class="replies-box">${repliesHtml}</div>` : ''}
            <div class="card-actions">
              <button class="btn-ghost listen-btn">🔊 육성 발제 듣기</button>
              <button class="btn-ghost btn-adopt adopt-btn">✓ 채택</button>
              <button class="btn-ghost btn-reconsider reconsider-btn">↺ 재숙고 명</button>
              <button class="btn-ghost toggle-reply-btn">💬 한 줄 지침</button>
            </div>
            <form class="reply-form">
              <input type="text" placeholder="이 의견에 대한 국왕의 지침이나 관점을 남기십시오..." required>
              <button type="submit" class="btn" style="white-space:nowrap;">하달</button>
            </form>
          </article>
        `;
      }).join('');

      feedEl.querySelectorAll('.card').forEach(card => {
        const id = card.dataset.id;
        const post = posts.find(p => p.id === id);
        const form = card.querySelector('.reply-form');
        const input = form.querySelector('input');

        card.querySelector('.listen-btn').onclick = () =>
          speakAsPersona(post.persona, `${post.body} ${post.initiative || ''}`);
        card.querySelector('.adopt-btn').onclick = () => submitStance(id, 'adopted');
        card.querySelector('.reconsider-btn').onclick = () => submitStance(id, 'reconsider');
        card.querySelector('.toggle-reply-btn').onclick = () => {
          form.classList.toggle('open');
          if (form.classList.contains('open')) input.focus();
        };

        form.onsubmit = async (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          await submitStance(id, 'directive', text);
        };
      });

      const seeds = [...(feed.publication_seeds || [])].reverse();
      document.getElementById('seedList').innerHTML = seeds.map(s => `
        <div class="seed-item">
          <div class="seed-tag">[${escapeHtml(s.ts)}] ${escapeHtml(s.genre)}</div>
          <div>${escapeHtml(s.seed)}</div>
        </div>
      `).join('');
    }

    async function loadFeed() {
      const res = await fetch('/api/feed').then(r => r.json());
      if (res.ok) renderAll(res);
    }

    document.getElementById('filterAllBtn').onclick = () => {
      activeFilter = 'all';
      if (stateData) renderAll(stateData);
    };

    document.getElementById('pulseBtn').onclick = async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const res = await fetch('/api/pulse', { method: 'POST' }).then(r => r.json());
        if (res.ok) {
          renderAll(res);
          showToast(`내각 7인 자율 숙고 및 토론 완료 (${res.result.phase})`);
        }
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById('seedForm').onsubmit = async (e) => {
      e.preventDefault();
      const genre = document.getElementById('seedGenre').value;
      const seedEl = document.getElementById('seedText');
      const seed = seedEl.value.trim();
      if (!seed) return;
      const res = await fetch('/api/seed', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ genre, seed })
      }).then(r => r.json());
      if (res.ok) {
        seedEl.value = '';
        renderAll(res);
        showToast('화두를 던져두었습니다. 내각이 대화창 밖에서 자율 숙성합니다.');
      } else {
        showToast('오류: ' + (res.error || '저장 실패'));
      }
    };

    loadFeed();
    setInterval(loadFeed, 60000);
  </script>
</body>
</html>
